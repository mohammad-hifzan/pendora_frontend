<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readers World</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // === URL-based theme loading ===

    // List routes that should use the "User" theme
    const authorThemePaths = ['/admin'];

    // Get the current pathname (no domain or query string)
    const currentPath = window.location.pathname;

    // Determine which theme to use
    const useAuthorTheme = authorThemePaths.some(path => currentPath.startsWith(path));

    const publicUrl = '%PUBLIC_URL%'; // Replaced by React at build time

    // List of theme file paths
    const themeFiles = useAuthorTheme
      ? {
          css: [
            '/themes/themeAuthor/css/theme-font.min.css',
            '/themes/themeAuthor/Bootstrap/dist/css/bootstrap.css',
            '/themes/themeAuthor/css/main.min.css'
          ],
          js: [
            '/themes/themeAuthor/js/jQuery/jquery-3.5.1.min.js',
            '/themes/themeAuthor/js/libs/jquery.mousewheel.min.js',
            '/themes/themeAuthor/js/libs/perfect-scrollbar.min.js',
            '/themes/themeAuthor/js/libs/imagesloaded.pkgd.min.js',
            '/themes/themeAuthor/js/libs/material.min.js',
            '/themes/themeAuthor/js/libs/selectize.min.js',
            '/themes/themeAuthor/js/libs/moment.min.js',
            '/themes/themeAuthor/js/libs/daterangepicker.min.js',
            '/themes/themeAuthor/js/libs/isotope.pkgd.min.js',
            '/themes/themeAuthor/js/libs/ajax-pagination.min.js',
            '/themes/themeAuthor/js/libs/jquery.magnific-popup.min.js',
            '/themes/themeAuthor/js/main.js',
            '/themes/themeAuthor/js/libs-init/libs-init.js',
            '/themes/themeAuthor/Bootstrap/dist/js/bootstrap.bundle.min.js',
            '/themes/themeAuthor/js/svg-loader.js'
          ]
        } : {
          css: [
            '/themes/themeUser/css/bootstrap.min.css',
            '/themes/themeUser/css/font-awesome.min.css',
            '/themes/themeUser/css/elegant-icons.css',
            '/themes/themeUser/css/plyr.css',
            '/themes/themeUser/css/nice-select.css',
            '/themes/themeUser/css/owl.carousel.min.css',
            '/themes/themeUser/css/slicknav.min.css',
            '/themes/themeUser/css/style.css'
          ],
          js: [
            '/themes/themeUser/js/jquery-3.3.1.min.js',
            '/themes/themeUser/js/bootstrap.min.js',
            '/themes/themeUser/js/player.js',
            '/themes/themeUser/js/jquery.nice-select.min.js',
            '/themes/themeUser/js/mixitup.min.js',
            '/themes/themeUser/js/jquery.slicknav.js',
            '/themes/themeUser/js/owl.carousel.min.js',
            '/themes/themeUser/js/main.js'
          ]
        };

    // Load CSS
    themeFiles.css.forEach(path => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = publicUrl + path;
      document.head.appendChild(link);
    });

    // Load JS
    themeFiles.js.forEach(path => {
      const script = document.createElement('script');
      script.src = publicUrl + path;
      script.defer = true;
      document.body.appendChild(script);
    });

    
    if (useAuthorTheme && window.location.pathname.includes('login')) {
      document.body.classList.add('landing-page');
      document.body.classList.remove('page-has-left-panels', 'page-has-right-panels');
    } else if (useAuthorTheme) {
      document.body.classList.add('page-has-left-panels', 'page-has-right-panels');
      document.body.classList.remove('landing-page');
    } else {
      document.body.classList.remove('landing-page', 'page-has-left-panels', 'page-has-right-panels');
    }
  </script>
</body>
</html>
